  STR_CRAFTLAUNCHALWAYS_DESC: "Летательные аппараты можно запускать, даже если они не готовы."
  STR_CUSTOMINITIALBASE: "Свободный дизайн первой базы"
  STR_CUSTOMINITIALBASE_DESC: "При старте новой игры вы можете вручную застроить первую базу вместо использования застройки по умолчанию."
